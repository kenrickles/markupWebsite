name: Portfolio checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            base_path: ''
            site_url: https://kenrickles.com
          - target: project
            base_path: /markupWebsite
            site_url: https://kenrickles.github.io/markupWebsite
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
      NEXT_PUBLIC_SITE_URL: ${{ matrix.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-review-${{ matrix.target }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
